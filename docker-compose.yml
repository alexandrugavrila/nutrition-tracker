services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: nutrition_user
      POSTGRES_PASSWORD: nutrition_pass
      POSTGRES_DB: nutrition
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
        - "${DEV_DB_PORT:-5432}:5432"
    networks:
      - nutrition-net

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://nutrition_user:nutrition_pass@db:5432/nutrition
      WATCHFILES_FORCE_POLLING: "true"
      ALEMBIC_CONFIG: /app/Backend/alembic.ini
      USDA_API_KEY: "${USDA_API_KEY}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:${DEV_FRONTEND_PORT:-3000},http://127.0.0.1:${DEV_FRONTEND_PORT:-3000}}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${BRANCH_WORKTREE_DIR:-.}/Backend:/app/Backend
    command:
      ["python", "-m", "uvicorn", "Backend.backend:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - nutrition-net
    ports:
        - "${DEV_BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: dev
    depends_on:
      - backend
    volumes:
      - ${BRANCH_WORKTREE_DIR:-.}/Frontend:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_URL: "http://backend:8000"
    ports:
        - "${DEV_FRONTEND_PORT:-3000}:3000"
    networks:
      - nutrition-net
    command: >
      sh -c "set -eux; npm ci; npm run dev"

volumes:
  dbdata:
  node_modules:


networks:
  nutrition-net:
